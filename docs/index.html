<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인간 염색체 핵형 분석 랩실</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', 'Malgun Gothic', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        #karyotype-area {
            flex: 0.65;
            padding: 15px;
            overflow-y: auto;
            background: #0f172a;
            border-bottom: 2px solid #334155;
            touch-action: pan-y;
        }

        .karyotype-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding-bottom: 20px;
        }

        .karyotype-slot {
            background: #1e293b;
            border: 2px dashed #475569;
            border-radius: 12px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            transition: all 0.2s ease;
        }

        /* 힌트 애니메이션 클래스 */
        .hint-active {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.15) !important;
            border-style: solid;
        }

        .hint-close {
            border-color: #10b981 !important;
            background-color: rgba(16, 185, 129, 0.3) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            transform: scale(1.05);
        }

        .slot-number {
            position: absolute;
            bottom: 4px;
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 700;
        }

        .slot-chromosomes {
            display: flex;
            gap: 2px;
            height: 70px;
            align-items: center;
            margin-bottom: 15px;
            pointer-events: none;
        }

        #pool-area {
            flex: 0.35;
            background: #1e293b;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-content: flex-start;
            touch-action: pan-y;
        }

        .chromosome {
            width: 18px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
            touch-action: none;
            transition: opacity 0.2s;
        }

        .chr-arm {
            width: 14px;
            border-radius: 7px;
            background-color: #cbd5e1;
            overflow: hidden;
            position: relative;
        }

        .p-arm { border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
        .q-arm { border-top-left-radius: 3px; border-top-right-radius: 3px; }

        .centromere {
            width: 8px;
            height: 3px;
            background-color: #cbd5e1;
            border-radius: 2px;
            margin: 1px 0;
            opacity: 0.8;
        }

        .wrong-match {
            animation: shake 0.4s;
            filter: drop-shadow(0 0 10px #ef4444) !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        /* 모달 오버레이 */
        #start-overlay, #end-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #end-modal { display: none; }
    </style>
</head>
<body>

    <!-- 시작 모달 (성별 선택) -->
    <div id="start-overlay">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 border border-gray-700">
            <div class="text-6xl mb-4">🔬</div>
            <h1 class="text-2xl font-bold text-blue-400 mb-2">핵형 분석 랩실</h1>
            <p class="text-gray-300 mb-6 text-sm">분석할 대상을 선택해 주세요.<br><span class="text-xs text-gray-500">(염색체를 누르면 힌트가 나타납니다)</span></p>
            <div class="flex gap-4">
                <button onclick="startGame('XY')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl text-lg shadow-[0_0_15px_rgba(37,99,235,0.5)] transition duration-200">
                    남성 (XY)
                </button>
                <button onclick="startGame('XX')" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 rounded-xl text-lg shadow-[0_0_15px_rgba(219,39,119,0.5)] transition duration-200">
                    여성 (XX)
                </button>
            </div>
        </div>
    </div>

    <!-- 메인 게임 영역 -->
    <div id="app-container">
        <header class="h-[60px] bg-slate-900 flex justify-between items-center px-4 shrink-0 border-b border-slate-700 shadow-md">
            <div>
                <h1 class="text-base font-bold text-blue-400">🧬 핵형 분석 랩실</h1>
            </div>
            <div class="text-right">
                <div id="timer" class="text-lg font-mono font-bold text-yellow-400">00:00.00</div>
                <div id="progress" class="text-xs font-semibold text-emerald-400">0 / 23 쌍 완성</div>
            </div>
        </header>

        <div id="karyotype-area">
            <div class="mb-3 text-sm font-semibold text-slate-400 flex justify-between items-center">
                <span>핵형 배치도 (1~23번)</span>
                <span id="gender-badge" class="text-xs bg-slate-800 px-2 py-1 rounded-md border border-slate-700">-</span>
            </div>
            <div id="karyotype-grid" class="karyotype-grid">
                <!-- JS에서 23개 슬롯 생성 -->
            </div>
        </div>

        <div id="pool-area">
            <!-- JS에서 염색체 조각들 렌더링 -->
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="end-modal">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 border border-slate-700">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-white mb-2">분석 완료!</h2>
            <p class="text-slate-400 mb-6 text-sm">완벽하게 모든 염색체를 분류했습니다.</p>
            <div class="bg-slate-900 rounded-xl p-4 mb-6 border border-slate-700">
                <span class="block text-xs text-slate-500 mb-1">최종 분석 기록</span>
                <span id="final-time" class="text-3xl font-mono font-bold text-yellow-400">00:00.00</span>
            </div>
            <button onclick="location.reload()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200">
                새로운 환자 분석하기
            </button>
        </div>
    </div>

    <script>
        let synth;
        function initAudio() {
            synth = new Tone.PolySynth(Tone.Synth).toDestination();
            synth.set({
                oscillator: { type: "sine" },
                envelope: { attack: 0.05, decay: 0.1, sustain: 0.1, release: 1 }
            });
        }

        function playSound(type) {
            if (!synth) return;
            const now = Tone.now();
            if (type === 'pickup') {
                synth.triggerAttackRelease("C5", "32n");
            } else if (type === 'drop') {
                synth.triggerAttackRelease(["E5", "G5"], "16n");
            } else if (type === 'error') {
                synth.triggerAttackRelease("D2", "8n");
            } else if (type === 'win') {
                synth.triggerAttackRelease("C4", "8n", now);
                synth.triggerAttackRelease("E4", "8n", now + 0.15);
                synth.triggerAttackRelease("G4", "8n", now + 0.3);
                synth.triggerAttackRelease("C5", "4n", now + 0.45);
            }
        }

        // 염색체 데이터 (1~22번, 23번 X, 24번 Y)
        const chrData = [
            { id: 1, height: 75, centromere: 0.48 }, { id: 2, height: 72, centromere: 0.39 }, { id: 3, height: 65, centromere: 0.46 },
            { id: 4, height: 60, centromere: 0.28 }, { id: 5, height: 58, centromere: 0.28 }, { id: 6, height: 55, centromere: 0.35 },
            { id: 7, height: 51, centromere: 0.38 }, { id: 8, height: 49, centromere: 0.32 }, { id: 9, height: 47, centromere: 0.35 },
            { id: 10, height: 46, centromere: 0.32 }, { id: 11, height: 45, centromere: 0.38 }, { id: 12, height: 44, centromere: 0.29 },
            { id: 13, height: 40, centromere: 0.15 }, { id: 14, height: 38, centromere: 0.15 }, { id: 15, height: 36, centromere: 0.15 },
            { id: 16, height: 34, centromere: 0.40 }, { id: 17, height: 32, centromere: 0.32 }, { id: 18, height: 30, centromere: 0.28 },
            { id: 19, height: 26, centromere: 0.45 }, { id: 20, height: 25, centromere: 0.42 }, { id: 21, height: 21, centromere: 0.15 },
            { id: 22, height: 20, centromere: 0.15 }, 
            { id: 23, height: 55, centromere: 0.40 }, // X 염색체
            { id: 24, height: 18, centromere: 0.15 }  // Y 염색체 (아주 작음)
        ];

        let matchedChromosomes = 0;
        let startTime = null;
        let timerInterval = null;
        let isPlaying = false;
        let currentGender = 'XX';

        function generateBands(id, armLength) {
            const numBands = Math.max(1, Math.floor(armLength / 5));
            let stops = [];
            for (let i = 0; i < numBands; i++) {
                const isDark = (id * 17 + i * 23) % 3 === 0;
                const color = isDark ? '#475569' : '#e2e8f0'; 
                stops.push(`${color} ${(i/numBands)*100}%`, `${color} ${((i+1)/numBands)*100}%`);
            }
            return `linear-gradient(to bottom, ${stops.join(', ')})`;
        }

        function createChromosomeDOM(data) {
            const chr = document.createElement('div');
            chr.className = 'chromosome';
            chr.dataset.id = data.id;

            const pArmHeight = data.height * data.centromere;
            const qArmHeight = data.height * (1 - data.centromere);

            const pArm = document.createElement('div');
            pArm.className = 'chr-arm p-arm';
            pArm.style.height = `${pArmHeight}px`;
            pArm.style.background = generateBands(data.id + 100, pArmHeight);

            const centromere = document.createElement('div');
            centromere.className = 'centromere';

            const qArm = document.createElement('div');
            qArm.className = 'chr-arm q-arm';
            qArm.style.height = `${qArmHeight}px`;
            qArm.style.background = generateBands(data.id, qArmHeight);

            chr.appendChild(pArm);
            chr.appendChild(centromere);
            chr.appendChild(qArm);

            chr.addEventListener('mousedown', onPointerDown);
            chr.addEventListener('touchstart', onPointerDown, { passive: false });
            return chr;
        }

        async function startGame(gender) {
            await Tone.start(); 
            initAudio();
            currentGender = gender;
            
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('gender-badge').innerText = gender === 'XY' ? '남성 (46, XY)' : '여성 (46, XX)';
            
            setupGame();
            isPlaying = true;
        }

        function setupGame() {
            const karyotypeGrid = document.getElementById('karyotype-grid');
            const poolArea = document.getElementById('pool-area');
            karyotypeGrid.innerHTML = '';
            poolArea.innerHTML = '';
            let pool = [];

            // 1. 슬롯 23개 생성
            for (let i = 1; i <= 23; i++) {
                const slot = document.createElement('div');
                slot.className = 'karyotype-slot';
                slot.dataset.slotId = i;
                
                const slotChrs = document.createElement('div');
                slotChrs.className = 'slot-chromosomes';
                
                const label = document.createElement('span');
                label.className = 'slot-number';
                label.innerText = i === 23 ? (currentGender === 'XY' ? '23 (XY)' : '23 (XX)') : i;

                slot.appendChild(slotChrs);
                slot.appendChild(label);
                karyotypeGrid.appendChild(slot);
            }

            // 2. 상염색체 생성 (1~22번, 쌍으로)
            for(let i=0; i<22; i++) {
                pool.push(createChromosomeDOM(chrData[i])); 
                pool.push(createChromosomeDOM(chrData[i]));
            }

            // 3. 성염색체 생성
            if (currentGender === 'XX') {
                pool.push(createChromosomeDOM(chrData[22])); // X
                pool.push(createChromosomeDOM(chrData[22])); // X
            } else {
                pool.push(createChromosomeDOM(chrData[22])); // X
                pool.push(createChromosomeDOM(chrData[23])); // Y
            }

            // 4. 셔플 알고리즘
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // 5. 흩뿌리기
            pool.forEach(chr => {
                const rot = (Math.random() - 0.5) * 40; 
                chr.style.transform = `rotate(${rot}deg)`;
                poolArea.appendChild(chr);
            });
        }

        function startTimer() {
            if (startTime) return;
            startTime = new Date();
            timerInterval = setInterval(() => {
                const diff = new Date() - startTime;
                const m = String(Math.floor(diff / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                const ms = String(Math.floor((diff % 1000) / 10)).padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}.${ms}`;
            }, 10);
        }

        let activeEl = null;
        let currentTargetSlot = null; // 힌트를 줄 슬롯
        let startX, startY;
        let transformOffsetX = 0, transformOffsetY = 0;

        function onPointerDown(e) {
            if (!isPlaying) return;
            const target = e.currentTarget;
            if (target.parentElement.classList.contains('slot-chromosomes')) return;

            e.preventDefault(); 
            activeEl = target;
            playSound('pickup');
            startTimer();

            // 대상 칸 찾기 및 클릭 힌트 표시
            // Y염색체(id:24)의 정답 칸은 23번
            const expectedSlotId = activeEl.dataset.id == 24 ? 23 : activeEl.dataset.id;
            currentTargetSlot = document.querySelector(`.karyotype-slot[data-slot-id="${expectedSlotId}"]`);
            
            if(currentTargetSlot) {
                currentTargetSlot.classList.add('hint-active');
            }

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            transformOffsetX = 0;
            transformOffsetY = 0;

            const rect = activeEl.getBoundingClientRect();
            activeEl.style.width = rect.width + 'px';
            activeEl.style.height = rect.height + 'px';
            activeEl.style.position = 'fixed';
            activeEl.style.left = rect.left + 'px';
            activeEl.style.top = rect.top + 'px';
            activeEl.style.zIndex = '9999';
            activeEl.style.pointerEvents = 'none'; 
            activeEl.style.transform = 'scale(1.2) rotate(0deg)'; 
            activeEl.style.filter = 'drop-shadow(0 10px 15px rgba(0,0,0,0.5)) brightness(1.2)';
            
            document.body.appendChild(activeEl);

            document.addEventListener('mousemove', onPointerMove, { passive: false });
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchend', onPointerUp);
        }

        function onPointerMove(e) {
            if (!activeEl) return;
            e.preventDefault();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            transformOffsetX = clientX - startX;
            transformOffsetY = clientY - startY;
            
            activeEl.style.transform = `translate(${transformOffsetX}px, ${transformOffsetY}px) scale(1.2)`;

            // 근접 힌트 로직 (중심점 거리 계산)
            if (currentTargetSlot) {
                const elRect = activeEl.getBoundingClientRect();
                const slotRect = currentTargetSlot.getBoundingClientRect();
                
                const elCenterX = elRect.left + elRect.width / 2;
                const elCenterY = elRect.top + elRect.height / 2;
                const slotCenterX = slotRect.left + slotRect.width / 2;
                const slotCenterY = slotRect.top + slotRect.height / 2;

                const distance = Math.sqrt(Math.pow(elCenterX - slotCenterX, 2) + Math.pow(elCenterY - slotCenterY, 2));

                // 거리가 70px 이내면 더 강한 힌트(초록색 발광) 표시
                if (distance < 70) {
                    currentTargetSlot.classList.add('hint-close');
                } else {
                    currentTargetSlot.classList.remove('hint-close');
                }
            }
        }

        function onPointerUp(e) {
            if (!activeEl) return;
            
            // 힌트 스타일 제거
            if (currentTargetSlot) {
                currentTargetSlot.classList.remove('hint-active', 'hint-close');
                currentTargetSlot = null;
            }

            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            
            const dropTarget = document.elementFromPoint(clientX, clientY);
            const slot = dropTarget ? dropTarget.closest('.karyotype-slot') : null;
            
            activeEl.style.pointerEvents = 'auto'; 
            activeEl.style.filter = 'drop-shadow(0 2px 3px rgba(0,0,0,0.6))';

            if (slot) {
                const targetId = slot.dataset.slotId;
                const chrId = activeEl.dataset.id;
                
                // 타겟 ID 계산 (24번 Y염색체는 23번 슬롯이 정답)
                const expectedTargetId = chrId == 24 ? 23 : chrId;
                const slotChrs = slot.querySelector('.slot-chromosomes');

                if (targetId == expectedTargetId && slotChrs.children.length < 2) {
                    playSound('drop');
                    resetElementStyle(activeEl);
                    slotChrs.appendChild(activeEl);
                    
                    matchedChromosomes++;
                    document.getElementById('progress').innerText = `${Math.floor(matchedChromosomes/2)} / 23 쌍 완성`;
                    
                    if (matchedChromosomes === 46) {
                        endGame();
                    }
                } else {
                    playSound('error');
                    returnToPool(activeEl);
                }
            } else {
                playSound('error');
                returnToPool(activeEl);
            }

            document.removeEventListener('mousemove', onPointerMove);
            document.removeEventListener('touchmove', onPointerMove);
            document.removeEventListener('mouseup', onPointerUp);
            document.removeEventListener('touchend', onPointerUp);
            activeEl = null;
        }

        function resetElementStyle(el) {
            el.style.position = 'static';
            el.style.transform = 'none';
            el.style.width = '';
            el.style.height = '';
            el.style.zIndex = '';
        }

        function returnToPool(el) {
            resetElementStyle(el);
            const rot = (Math.random() - 0.5) * 40;
            el.style.transform = `rotate(${rot}deg)`;
            document.getElementById('pool-area').appendChild(el);
            
            el.classList.add('wrong-match');
            setTimeout(() => el.classList.remove('wrong-match'), 400);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            playSound('win');
            setTimeout(() => {
                document.getElementById('final-time').innerText = document.getElementById('timer').innerText;
                document.getElementById('end-modal').style.display = 'flex';
            }, 500);
        }
    </script>
</body>
</html>
