<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상동 염색체 짝 맞추기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h2 { color: #333; }
        #timer { font-size: 24px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 400px; margin: 0 auto; }
        .chromosome { width: 100%; aspect-ratio: 1 / 2; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s ease; position: relative; }
        .chromosome::after { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background-color: rgba(255,255,255,0.6); transform: translateY(-50%); }
        .selected { transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); border: 3px solid #333; }
        .matched { visibility: hidden; opacity: 0; }
        #result { display: none; margin-top: 30px; padding: 20px; background-color: #dff0d8; border: 2px solid #3c763d; border-radius: 10px; color: #3c763d; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🧬 상동 염색체 짝 맞추기</h2>
    <div id="timer">0.00초</div>
    <div id="board"></div>
    <div id="result"></div>
    <script>
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5'];
        let chromosomes = [...colors, ...colors];
        let selectedElement = null, matchedCount = 0, startTime = null, timerInterval = null, isPlaying = false;
        
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        function updateTimer() {
            document.getElementById('timer').innerText = ((new Date() - startTime) / 1000).toFixed(2) + '초';
        }
        function initGame() {
            shuffle(chromosomes);
            const board = document.getElementById('board');
            board.innerHTML = '';
            chromosomes.forEach((color, index) => {
                const div = document.createElement('div');
                div.classList.add('chromosome');
                div.style.backgroundColor = color;
                div.dataset.color = color;
                div.addEventListener('click', () => handleSelect(div));
                board.appendChild(div);
            });
        }
        function handleSelect(element) {
            if (element.classList.contains('matched') || element === selectedElement) return;
            if (!isPlaying) { isPlaying = true; startTime = new Date(); timerInterval = setInterval(updateTimer, 10); }
            element.classList.add('selected');
            if (!selectedElement) {
                selectedElement = element;
            } else {
                if (selectedElement.dataset.color === element.dataset.color) {
                    const el1 = selectedElement, el2 = element;
                    setTimeout(() => { el1.classList.add('matched'); el2.classList.add('matched'); matchedCount += 2; checkWin(); }, 300);
                } else {
                    const el1 = selectedElement, el2 = element;
                    setTimeout(() => { el1.classList.remove('selected'); el2.classList.remove('selected'); }, 500);
                }
                selectedElement = null;
            }
        }
        function checkWin() {
            if (matchedCount === chromosomes.length) {
                clearInterval(timerInterval);
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `🎉 성공! <br>기록: ${document.getElementById('timer').innerText} <br>선생님께 화면을 보여주세요!`;
                document.getElementById('board').style.display = 'none';
            }
        }
        initGame();
    </script>
</body>
</html>
